# The Standoff lobby server (Timmy, 18 Oct 2026: "Relay + room codes" to play with a friend on another Wi-Fi; 20:19 a
# lobby system like YOMI's Steam lobbies). One Durable Object per lobby passes messages between its members (one phone
# in each match runs it); one more keeps the list of public lobbies.
# Free plan: SQLite-backed Durable Objects, WebSocket hibernation (no duration billed while a lobby is quiet).
name = "standoff-relay"
account_id = "cc628a4b259951e4fd6b9abc559227fa"   # (Timmy's account - workers.dev subdomain blissfulzephyr)
main = "src/index.js"
compatibility_date = "2025-06-01"

[[durable_objects.bindings]]
name = "LOBBIES"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby", "Directory"]
